<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LevelUp">
<meta name="theme-color" content="#0A0A0B">
<title>LevelUp · باشگاه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --bg2:#111112; --surface:#161618; --surface2:#222225; --line:rgba(255,255,255,.07); --gline:rgba(212,175,55,.28);
  --text:#F4EFE3; --muted:#9A9384;
  --gold:#D4AF37; --gold2:#F3D98B; --gold-ink:#1A1405;
  --goldgrad:linear-gradient(135deg,#F7E3A1 0%,#D4AF37 45%,#A67C1F 100%);
  --ok:#D4AF37; --warn:#FF8A3D; --danger:#FF4D5E; --paid:#4CC38A;
  --shadow:0 14px 36px rgba(0,0,0,.55);
  --r-lg:24px; --r-md:18px; --tab-h:74px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:'Vazirmatn',system-ui,-apple-system,Tahoma,sans-serif;font-size:15px;line-height:1.6;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
svg{display:block}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
  background:linear-gradient(var(--bg) 72%,transparent);display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px;direction:ltr}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--goldgrad);display:grid;place-items:center;color:var(--gold-ink);font-family:'Russo One',sans-serif;font-size:14px}
.logo-text{font-family:'Russo One',sans-serif;font-size:17px;line-height:1;letter-spacing:.5px}
.logo-text span{color:var(--gold)}
.top-actions{display:flex;align-items:center;gap:8px}
.coach-pill{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;max-width:170px}
.coach-pill .dot{width:22px;height:22px;border-radius:99px;background:var(--goldgrad);color:var(--gold-ink);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.coach-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach-pill svg{width:14px;height:14px;color:var(--muted);flex:none}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{color:var(--gold);border-color:var(--gline)}

main{padding:4px 18px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 36px);max-width:720px;margin:0 auto}
.view-in{animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2.sec{font-size:16.5px;font-weight:800;margin:28px 2px 12px;display:flex;align-items:center;gap:8px}
h2.sec .n{font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border-radius:99px;padding:0 9px}
h2.sec .more{margin-inline-start:auto;font-size:12.5px;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px;margin-top:4px;background:linear-gradient(160deg,#17150F 0%,#111112 55%);border:1px solid var(--gline)}
.hero::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.hero-row{display:flex;align-items:center;gap:16px}
.hero .t{flex:1;min-width:0}
.hero .eyebrow{font-size:12.5px;color:var(--gold);font-weight:700}
.hero h1{font-size:21px;line-height:1.45;margin:2px 0 0;font-weight:800}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:18px;font-weight:800}
.ring .v small{display:block;font-size:10px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 14px;border-top:1px solid var(--line);padding-top:14px}
.mini div{text-align:center}
.mini div+div{border-inline-start:1px solid var(--line)}
.mini b{display:block;font-size:19px;font-weight:800;line-height:1.3}
.mini span{font-size:11.5px;color:var(--muted)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px}
.stat .v{font-size:18px;font-weight:800;line-height:1.4}
.stat .l{font-size:12px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:800;font-size:15px;background:var(--surface2);color:var(--text);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--goldgrad);color:var(--gold-ink)}
.btn.danger{background:rgba(255,77,94,.13);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.sm svg{width:17px;height:17px}

/* ---------- student card ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.stu{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;transition:transform .12s}
.stu:active{transform:scale(.99)}
.ava{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface2));border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.ava.sm{width:38px;height:38px;border-radius:12px;font-size:14px}
.stu-main{flex:1;min-width:0}
.stu-name{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.pips{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:3px;background:var(--surface2)}
.pips i.on{background:var(--c,var(--ok))}
.pips.big i{width:14px;height:14px;border-radius:5px}
.rem{flex:none;text-align:center;min-width:40px}
.rem b{display:block;font-size:22px;font-weight:800;line-height:1.1;color:var(--c,var(--text))}
.rem small{font-size:11px;color:var(--muted)}
.chk{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);transition:all .18s}
.chk svg{width:24px;height:24px}
.chk.done{background:var(--goldgrad);color:var(--gold-ink)}
.chk.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:0 9px;white-space:nowrap;line-height:1.8}
.pill.ok{background:rgba(212,175,55,.13);color:var(--gold)}
.pill.warn{background:rgba(255,138,61,.14);color:var(--warn)}
.pill.end{background:rgba(255,77,94,.14);color:var(--danger)}
.pill.none{background:var(--surface2);color:var(--muted)}
.pill.debt{background:rgba(255,77,94,.1);color:var(--danger)}
.pill.paid{background:rgba(76,195,138,.13);color:var(--paid)}
.pill.coach{background:var(--surface2);color:var(--muted)}

.alert{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;border-inline-start:4px solid var(--c);cursor:pointer}
.alert .t{flex:1;min-width:0}
.alert .t b{display:block;font-weight:800}
.alert .t span{font-size:12.5px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:9px 12px;margin-top:12px;font-size:12.5px;background:var(--surface);border:1px dashed var(--gline);color:var(--muted)}
.banner svg{width:18px;height:18px;color:var(--gold);flex:none}
.banner .t{flex:1}
.banner button{color:var(--gold);font-weight:800;font-size:12.5px}

/* ---------- search & chips ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:50px;margin-top:6px}
.search:focus-within{border-color:var(--gline)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:16px;height:100%;min-width:0}
.search.sm{height:44px;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* ---------- attendance ---------- */
.daynav{display:flex;align-items:center;gap:8px;margin-top:4px}
.daynav .nav{width:44px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);flex:none}
.daynav .nav svg{width:20px;height:20px}
.daybtn{flex:1;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--gline);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.35}
.daybtn small{font-size:11.5px;color:var(--gold);font-weight:700}
.daybtn b{font-size:15px;font-weight:800}
.past-note{margin-top:10px;font-size:12.5px;color:var(--warn);text-align:center;background:rgba(255,138,61,.08);border-radius:12px;padding:7px}
.att-count{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.att-count b{font-size:38px;font-weight:800;line-height:1}
.att-count span{color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--goldgrad);border-radius:99px;transition:width .5s}

/* ---------- money / rows ---------- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 14px}
.pay{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.pay .t{flex:1;min-width:0}
.pay .t b{display:block;font-weight:700}
.pay .t span{font-size:12.5px;color:var(--muted)}
.pay .a{font-weight:800;white-space:nowrap}
.month-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px;font-weight:800}
.month-h span{font-size:13px;color:var(--gold)}

/* ---------- fridge ---------- */
.fridge-cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--gline);margin-top:12px;text-align:start}
.fridge-cta .ic{width:52px;height:52px;border-radius:16px;background:var(--goldgrad);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.fridge-cta .ic svg{width:26px;height:26px}
.fridge-cta b{display:block;font-size:16px;font-weight:800}
.fridge-cta span{font-size:12.5px;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:8px;max-height:176px;overflow-y:auto;padding:2px}
.pick button{height:38px;padding:0 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.pick button.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.pick button.guest{border-style:dashed;color:var(--gold)}
.pick button.guest.on{color:var(--gold-ink)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.qty button{width:58px;height:58px;border-radius:14px;background:var(--surface2);font-size:28px;font-weight:700;color:var(--gold)}
.qty b{font-size:40px;font-weight:800;color:var(--text)}
.sum-line{display:flex;justify-content:space-between;align-items:center;background:rgba(212,175,55,.07);border:1px solid var(--gline);border-radius:14px;padding:12px 14px;color:var(--text);font-weight:800}
.sum-line span{color:var(--muted);font-weight:600;font-size:13px}
.tog{padding:0 10px;height:28px;border-radius:99px;font-size:12px;font-weight:800}
.tog.paid{background:rgba(76,195,138,.13);color:var(--paid)}
.tog.unpaid{background:rgba(255,77,94,.13);color:var(--danger)}

/* ---------- settings ---------- */
.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .t{flex:1;min-width:0}
.set .t b{display:block;font-weight:700}
.set .t span{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:12px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:9px;font-size:20px;font-weight:700}
.stepper b{min-width:26px;text-align:center}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg.big button{height:44px;font-size:14px}
.seg.big button.on.p{color:var(--paid)}
.seg.big button.on.u{color:var(--danger)}
.mini-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface2);flex:none}
.mini-btn svg{width:16px;height:16px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty .ic{width:70px;height:70px;margin:0 auto 14px;border-radius:22px;background:var(--surface);border:1px solid var(--gline);display:grid;place-items:center;color:var(--gold)}
.empty .ic svg{width:32px;height:32px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:16px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(10,10,11,.86);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar .in{display:flex;justify-content:space-around;align-items:center;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--gold)}
.tab.mid .c{width:56px;height:56px;border-radius:19px;background:var(--goldgrad);display:grid;place-items:center;margin-top:-22px;box-shadow:0 10px 24px rgba(212,175,55,.25);border:4px solid var(--bg)}
.tab.mid .c svg{width:28px;height:28px;color:var(--gold-ink)}
.fab{position:fixed;left:20px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:25;width:58px;height:58px;border-radius:20px;background:var(--goldgrad);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 10px 26px rgba(212,175,55,.3)}
.fab svg{width:28px;height:28px}
.fab[hidden]{display:none}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;background:var(--bg2);border-radius:28px 28px 0 0;border-top:1px solid var(--gline);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);max-width:720px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet:not(.show){visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s .32s}
.sheet.show{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--surface2);margin:10px auto 0;flex:none}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 16px}
.sh h3{margin:0;font-size:19px;font-weight:800}
.x{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:18px;height:18px}

/* ---------- forms ---------- */
.f{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.fl input,.fl textarea{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;font-weight:600;color:var(--text);outline:0;width:100%;-webkit-appearance:none;appearance:none}
.fl textarea{height:84px;padding:12px 14px;resize:none}
.fl input:focus,.fl textarea:focus{border-color:var(--gold)}
.fl input.num{direction:ltr;text-align:left}
.fl .hint{font-weight:500;font-size:12px;color:var(--gold)}
.fl .sub{font-weight:500;font-size:12px;color:var(--muted)}
.datebtn{display:flex;align-items:center;gap:10px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15.5px;font-weight:700;color:var(--text);width:100%}
.datebtn svg{width:20px;height:20px;color:var(--gold)}
.datebtn small{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}
.qchips{display:flex;gap:6px}
.qchips.wrap{flex-wrap:wrap}
.qchips button{flex:1;min-width:0;height:40px;padding:0 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:800}
.qchips.wrap button{flex:none;padding:0 14px}
.qchips button.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.linkbtn{color:var(--gold);font-weight:700;font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- detail ---------- */
.det-top{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.det-top .ava{width:58px;height:58px;border-radius:19px;font-size:21px}
.det-top .n{flex:1;min-width:0}
.det-top .n b{display:block;font-size:19px;font-weight:800;line-height:1.4}
.det-top .n span{font-size:12.5px;color:var(--muted)}
.xp-card{background:var(--surface);border:1px solid var(--gline);border-radius:var(--r-lg);padding:18px}
.xp-card .big{display:flex;align-items:baseline;gap:8px}
.xp-card .big b{font-size:44px;font-weight:800;line-height:1;color:var(--c)}
.xp-card .big span{color:var(--muted);font-weight:700}
.xp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.xp-grid div{text-align:center}
.xp-grid b{display:block;font-size:15px;font-weight:800}
.xp-grid span{font-size:11.5px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-size:12px;font-weight:700}
.act svg{width:22px;height:22px;color:var(--gold)}
.act.hot{background:var(--goldgrad);border-color:transparent;color:var(--gold-ink)}

.act.done{background:rgba(212,175,55,.12);border-color:var(--gline);color:var(--gold)}
.contact{display:flex;gap:8px;margin-bottom:6px}
.contact a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:13px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13px;font-weight:700}
.contact a svg{width:18px;height:18px;color:var(--gold)}
.contact a.wa svg{color:#25D366}
.fridge-due{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.2);font-size:13px;font-weight:700}
.fridge-due svg{width:20px;height:20px;color:var(--danger);flex:none}
.fridge-due .t{flex:1}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:2px 14px;margin-top:12px}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-weight:700;font-size:14px}
.hrow .t span{font-size:12px;color:var(--muted)}
.hrow .del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.hrow .del svg{width:17px;height:17px}
.hrow .no{width:30px;height:30px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:var(--gold)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-bottom:12px;white-space:pre-wrap}

/* ---------- toast / dialog / date picker ---------- */
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:95;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:520px;width:100%;padding:12px 14px;border-radius:16px;background:#1B1B1D;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:14px;animation:tin .3s cubic-bezier(.2,.9,.25,1)}
.toast .d{width:10px;height:10px;border-radius:99px;background:var(--c);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.toast .m{flex:1}
.toast .btn{height:32px;font-size:12.5px;padding:0 12px;border-radius:10px}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.dlg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s}
.dlg.show{opacity:1;pointer-events:auto}
.dlg .card{width:100%;max-width:370px;background:var(--bg2);border:1px solid var(--gline);border-radius:24px;padding:20px;box-shadow:var(--shadow);transform:scale(.95);transition:transform .2s}
.dlg.show .card{transform:none}
.dlg h4{margin:0 0 6px;font-size:18px;font-weight:800}
.dlg p{margin:0 0 20px;color:var(--muted);font-size:14px}
.dlg .bs{display:flex;gap:10px}
.dlg .bs .btn{flex:1}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dp-h b{font-size:17px;font-weight:800}
.dp-h button{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--gold)}
.dp-h button svg{width:20px;height:20px}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dp-w span{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:6px}
.dp-g button{height:40px;border-radius:11px;font-weight:700;font-size:14.5px}
.dp-g button.today{border:1px solid var(--gold);color:var(--gold)}
.dp-g button.on{background:var(--goldgrad);color:var(--gold-ink);border:0}
.dp-g button.fri{color:var(--danger)}
.dp-g button.on.fri{color:var(--gold-ink)}
.dp-g button:disabled{opacity:.25}
.dp-foot{display:flex;gap:10px;margin-top:14px}
.dp-foot .btn{flex:1;height:44px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:30px}
.foot b{font-family:'Russo One',sans-serif;font-weight:400;color:var(--gold)}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><div class="logo-mark">LU</div><div class="logo-text">LEVEL<span>UP</span></div></div>
  <div class="top-actions" id="topActions"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" data-act="addStudent" aria-label="شاگرد جدید" hidden></button>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="body" id="sheetBody"></div></section>
<div class="toasts" id="toasts"></div>
<div class="dlg" id="dlg"><div class="card" id="dlgCard"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ================== ICONS ================== */
const sv = (p, w=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: sv('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  users: sv('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4.5a4 4 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/>'),
  check: sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 2.6),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 2.4),

  bottle: sv('<path d="M10 2h4v3l1.5 2.5V20a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2V7.5L10 5z"/><path d="M8.5 12h7M8.5 16h7"/>'),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>', 2.4),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  renew: sv('<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>'),
  cash: sv('<rect x="2" y="6" width="20" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/>'),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'),
  trash: sv('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  phone: sv('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  msg: sv('<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/>'),
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7a11.4 11.4 0 0 1-4.4-3.9c-.3-.5-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg>',
  alert: sv('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'),
  download: sv('<path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  upload: sv('<path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  cal: sv('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  chevR: sv('<path d="m9 6 6 6-6 6"/>', 2.4),
  chevL: sv('<path d="m15 6-6 6 6 6"/>', 2.4),
  chevD: sv('<path d="m6 9 6 6 6-6"/>', 2.4),
  whistle: sv('<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/><path d="M12 12v3"/>'),
};

/* ================== JALALI CALENDAR ================== */
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
function jalCal(jy){const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];const gy=jy+621;let leapJ=-14,jp=br[0],jm,jump,leap,n,i;for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm;}n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;const march=20+leapJ-leapG;if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march};}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d;}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1;const gm=mod(div(i,153),12)+1;const gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd};}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy);const f=g2d(gy,3,r.march);let jd,jm,k=jdn-f;if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd};}else k-=186;}else{jy-=1;k+=179;if(r.leap===1)k+=1;}jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd};}
const toJ=(y,m,d)=>d2j(g2d(y,m,d)), toG=(y,m,d)=>d2g(j2d(y,m,d));
const jmLen=(y,m)=>m<=6?31:m<=11?30:(jalCal(y).leap===0?30:29);
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const jOf = ts => { const d = new Date(ts); return toJ(d.getFullYear(), d.getMonth()+1, d.getDate()); };
const tsOfJ = (jy,jm,jd) => { const g = toG(jy,jm,jd); return new Date(g.gy, g.gm-1, g.gd, 12, 0, 0).getTime(); };

/* ================== DATA ================== */
const KEY = 'levelup_gym_v1';
const DEF = () => ({ students:[], coaches:[{id:'c1', name:'مهدی'}], items:[{id:'water', name:'بطری آب', price:0}], fridge:[],
  settings:{ warnAt:2, coachId:'', lastBackup:null } });
function normalize(d){
  const D = DEF();
  d.settings = Object.assign(D.settings, d.settings||{});
  d.students = d.students || [];
  if(!Array.isArray(d.coaches) || !d.coaches.length) d.coaches = D.coaches;
  if(!Array.isArray(d.items) || !d.items.length) d.items = D.items;
  d.fridge = d.fridge || [];
  d.students.forEach(s => { s.packages = s.packages||[]; s.attendance = s.attendance||[]; s.payments = s.payments||[]; if(!s.coachId || !d.coaches.some(c=>c.id===s.coachId)) s.coachId = d.coaches[0].id; });
  if(d.settings.coachId && !d.coaches.some(c=>c.id===d.settings.coachId)) d.settings.coachId = '';
  return d;
}
let db = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return normalize(JSON.parse(r)); }catch(e){}
  return DEF();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('ذخیره نشد. حافظه‌ی مرورگر پر است یا در دسترس نیست.', 'danger'); }
}
save();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ================== HELPERS ================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const fa = n => Number(n||0).toLocaleString('fa-IR');
const money = n => fa(n) + ' تومان';
const toEn = s => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num = s => { const n = parseInt(toEn(s).replace(/[^\d]/g,''), 10); return isNaN(n) ? 0 : n; };
const jdate = ts => { const j = jOf(ts); return `${fd(j.jd)} ${JM[j.jm-1]} ${fd(j.jy)}`; };
const jday = ts => { const j = jOf(ts); return `${WD[new Date(ts).getDay()]} ${fd(j.jd)} ${JM[j.jm-1]}`; };
const jfull = ts => `${WD[new Date(ts).getDay()]} ${jdate(ts)}`;
const jtime = ts => fd(new Date(ts).toTimeString().slice(0,5));
const monthKey = ts => { const j = jOf(ts); return j.jy + '-' + j.jm; };
const monthName = ts => { const j = jOf(ts); return JM[j.jm-1] + ' ' + fd(j.jy); };
const sameDay = (a,b) => { const x=new Date(a), y=new Date(b); return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate(); };
const noon = ts => { const d = new Date(ts); d.setHours(12,0,0,0); return d.getTime(); };
const stamp = ts => sameDay(ts, Date.now()) ? Date.now() : noon(ts);
const byId = id => db.students.find(s => s.id === id);
const coachOf = id => db.coaches.find(c => c.id === id);
const itemOf = id => db.items.find(i => i.id === id);
const scoped = () => db.settings.coachId ? db.students.filter(s => s.coachId === db.settings.coachId) : db.students;
function rel(ts){
  const a = new Date(); a.setHours(0,0,0,0); const b = new Date(ts); b.setHours(0,0,0,0);
  const d = Math.round((a-b)/86400000);
  if(d===0) return 'امروز'; if(d===1) return 'دیروز'; if(d===-1) return 'فردا';
  if(d<0) return fa(-d)+' روز بعد';
  if(d<7) return fa(d)+' روز پیش'; if(d<30) return fa(Math.floor(d/7))+' هفته پیش'; return jdate(ts);
}
const PALETTE = ['#D4AF37','#E0B872','#C98B5B','#9FB4C7','#B89AD8','#7FC4B0','#E08A8A','#C7C08A'];
function avaColor(name){ let h=0; for(const c of String(name)) h = (h*31 + c.charCodeAt(0))|0; return PALETTE[Math.abs(h)%PALETTE.length]; }
function initials(name){ const p = String(name).trim().split(/\s+/); return esc((p[0]||'?').charAt(0) + (p.length>1 ? '‌'+p[p.length-1].charAt(0) : '')); }
function ava(name, sm){ return `<div class="ava ${sm?'sm':''}" style="--c:${avaColor(name)}">${initials(name)}</div>`; }
function waPhone(p){ const raw = toEn(p).trim(); let d = raw.replace(/[^\d]/g,''); if(raw.startsWith('+')) return d; if(d.startsWith('00')) return d.slice(2); if(d.startsWith('0')) return '98'+d.slice(1); return d; }

/* ================== STATS ================== */
const STATUS = {
  ok:{label:'فعال', c:'var(--ok)'}, warn:{label:'رو به اتمام', c:'var(--warn)'},
  end:{label:'جلسات تمام شده', c:'var(--danger)'}, none:{label:'بدون دوره', c:'var(--muted)'}
};
const realAtt = s => s.attendance.filter(a => !a.imported);
const inDay = (s, day) => realAtt(s).some(a => sameDay(a.date, day));
function fridgeDue(sid){ return db.fridge.filter(f => f.studentId===sid && !f.paid).reduce((a,f)=>a+f.qty*f.unit,0); }
function st(s){
  const total = s.packages.reduce((a,p)=>a+(+p.sessions||0),0);
  const used = s.attendance.length, remaining = total - used;
  const price = s.packages.reduce((a,p)=>a+(+p.price||0),0);
  const paid = s.payments.reduce((a,p)=>a+(+p.amount||0),0);
  const debt = Math.max(0, price - paid);
  const cur = s.packages[s.packages.length-1];
  const curTotal = cur ? +cur.sessions : 0;
  const ra = realAtt(s);
  const last = ra.length ? Math.max(...ra.map(a=>a.date)) : null;
  const todayIn = inDay(s, Date.now());
  const status = !s.packages.length ? 'none' : remaining<=0 ? 'end' : remaining<=db.settings.warnAt ? 'warn' : 'ok';
  return {total, used, remaining, price, paid, debt, cur, curTotal, last, todayIn, status, fridge: fridgeDue(s.id)};
}
function pips(x, big){
  const n = Math.min(30, Math.max(x.curTotal, x.remaining, 1));
  const on = Math.max(0, Math.min(n, x.remaining));
  let h = ''; for(let i=0;i<n;i++) h += `<i class="${i<on?'on':''}"></i>`;
  return `<div class="pips ${big?'big':''}" style="--c:${STATUS[x.status].c}">${h}</div>`;
}

/* ================== RENDER ================== */
let tab = 'home', q = '', filter = 'all', detId = null, detTab = 'att', attDay = Date.now();
const TABS = [
  {id:'home', t:'خانه', i:'home'}, {id:'students', t:'شاگردان', i:'users'},
  {id:'attend', t:'حضور', i:'check', mid:true}, {id:'money', t:'مالی', i:'wallet'}, {id:'fridge', t:'یخچال', i:'bottle'}
];
function renderChrome(){
  const c = coachOf(db.settings.coachId);
  $('#topActions').innerHTML = `<button class="coach-pill" data-act="coachPick"><span class="dot">${c ? esc(c.name.charAt(0)) : '★'}</span><span>${c ? 'مربی ' + esc(c.name) : 'همه‌ی مربی‌ها'}</span>${I.chevD}</button>
    <button class="icon-btn ${tab==='settings'?'on':''}" data-act="tab" data-id="settings" aria-label="تنظیمات">${I.gear}</button>`;
  $('#tabs').innerHTML = TABS.map(t => t.mid

function studentCard(s, day){
  day = day || Date.now();
  const x = st(s), here = inDay(s, day);
  const meta = [`<span class="pill ${x.status}">${STATUS[x.status].label}</span>`];
  if(x.debt>0) meta.push(`<span class="pill debt">بدهی ${fa(x.debt)}</span>`);
  if(x.fridge>0) meta.push(`<span class="pill debt">یخچال ${fa(x.fridge)}</span>`);
  if(!db.settings.coachId && db.coaches.length>1){ const c = coachOf(s.coachId); if(c) meta.push(`<span class="pill coach">${esc(c.name)}</span>`); }
  return `<div class="stu" data-act="open" data-id="${s.id}">
    ${ava(s.name)}
    <div class="stu-main"><div class="stu-name">${esc(s.name)}</div><div class="stu-meta">${meta.join('')}</div>${x.status!=='none'?pips(x):''}</div>
    <div class="rem" style="--c:${STATUS[x.status].c}"><b>${fa(x.remaining)}</b><small>جلسه</small></div>
    <button class="chk ${here?'done':''}" data-act="check" data-id="${s.id}" data-day="${day}" aria-label="${here?'لغو حضور':'ثبت حضور'}">${here?I.check:I.plus}</button>
  </div>`;
}
function emptyState(title, text, btn){
  return `<div class="empty"><div class="ic">${I.users}</div><b>${title}</b>${text}${btn?`<div><button class="btn primary" data-act="addStudent">${I.plus} افزودن شاگرد</button></div>`:''}</div>`;
}
function ringSvg(pct){
  const r = 32, c = 2*Math.PI*r, off = c*(1-Math.min(pct,100)/100);
  return `<svg viewBox="0 0 78 78"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7E3A1"/><stop offset="1" stop-color="#A67C1F"/></linearGradient></defs>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="#222225" stroke-width="7"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function fridgeScoped(){
  if(!db.settings.coachId) return db.fridge;
  const ids = new Set(scoped().map(s=>s.id));
  return db.fridge.filter(f => !f.studentId || ids.has(f.studentId));
}

  const remText = x.remaining<=0 ? (x.remaining<0 ? `${fa(-x.remaining)} جلسه بیشتر از دوره حاضر شده` : 'جلسات این دوره تموم شده') : x.remaining<=db.settings.warnAt ? 'دوره داره تموم می‌شه' : 'دوره در جریانه';

    <div class="xp-card" style="--c:${S.c}">
      <div class="big"><b>${fa(x.remaining)}</b><span>جلسه باقی‌مانده</span></div>
      <div class="muted" style="font-size:13px;margin:4px 0 2px">${x.status==='none'?'هنوز دوره‌ای ثبت نشده':remText}</div>

      </div>

    ${x.fridge ? `<div class="fridge-due">${I.bottle}<div class="t">${money(x.fridge)} از یخچال حساب نکرده</div><button class="btn sm primary" data-act="fridgeSettle" data-id="${s.id}">حساب کرد</button></div>` : ''}

    ${phone ? `<div class="contact">

      <button class="${detTab==='att'?'on':''}" data-act="detTab" data-id="att">حضور</button>

const FORMS = {
  student(d){
    const name = (d.name||'').trim(); if(!name){ toast('نام شاگرد رو وارد کن.', 'warn'); return; }
    if(d.id){
      const s = byId(d.id); s.name = name; s.phone = toEn(d.phone).trim(); s.note = (d.note||'').trim(); s.coachId = d.coachId || s.coachId;
      if(d.createdAt) s.createdAt = +d.createdAt;
      save(); toast('تغییرات ذخیره شد.', 'ok'); back(); refresh(); return;
    }
    const date = stamp(+d.date || Date.now()), ses = num(d.sessions), before = Math.min(num(d.usedBefore), ses || 999);
    const s = { id:uid(), name, phone:toEn(d.phone).trim(), note:(d.note||'').trim(), coachId:d.coachId || db.coaches[0].id, createdAt:date, packages:[], attendance:[], payments:[] };
    if(ses>0) s.packages.push({id:uid(), sessions:ses, price:num(d.price), date});
    for(let i=0;i<before;i++) s.attendance.push({id:uid(), date:noon(date), imported:true});
    if(num(d.paid)>0) s.payments.push({id:uid(), amount:num(d.paid), date, note:'ثبت‌نام'});
    db.students.push(s); save();
    toast(`${name} اضافه شد.`, 'ok'); closeSheet(); refresh();
  },
  renew(d){
    const s = byId(d.id), ses = num(d.sessions); if(ses<=0){ toast('تعداد جلسات رو وارد کن.', 'warn'); return; }
    const date = stamp(+d.date);
    s.packages.push({id:uid(), sessions:ses, price:num(d.price), date});
    if(num(d.paid)>0) s.payments.push({id:uid(), amount:num(d.paid), date, note:'تمدید'});
    save(); toast(`دوره‌ی ${s.name} تمدید شد. ${fa(st(s).remaining)} جلسه باقی‌مانده.`, 'ok'); back(); refresh();
  },
  pay(d){
    const s = byId(d.id), a = num(d.amount); if(a<=0){ toast('مبلغ رو وارد کن.', 'warn'); return; }
    s.payments.push({id:uid(), amount:a, date:stamp(+d.date), note:(d.note||'').trim()});
    save(); toast(`پرداخت ${money(a)} ثبت شد.`, 'ok'); back(); refresh();
  },
  attDate(d){
    const s = byId(d.id), day = +d.date;
    if(inDay(s, day)){ toast('برای این روز قبلاً حضور ثبت شده.', 'warn'); return; }
    s.attendance.push({id:uid(), date:stamp(day)}); save(); afterCheckToast(s); back(); refresh();
  },
  coach(d){
    const name = (d.name||'').trim(); if(!name){ toast('نام مربی رو وارد کن.', 'warn'); return; }
    if(d.id){ coachOf(d.id).name = name; } else db.coaches.push({id:uid(), name});
    save(); toast('ذخیره شد.', 'ok'); closeSheet(); refresh();
  },
  item(d){
    const name = (d.name||'').trim(); if(!name){ toast('نام آیتم رو وارد کن.', 'warn'); return; }
    if(d.id){ const it = itemOf(d.id); it.name = name; it.price = num(d.price); } else db.items.push({id:uid(), name, price:num(d.price)});
    save(); toast('ذخیره شد.', 'ok'); closeSheet(); refresh();
  },
  fridge(d){
    if(!d.who){ toast('انتخاب کن کی برداشت.', 'warn'); return; }
    const guest = d.who==='guest' ? (d.guest||'').trim() : '';
    if(d.who==='guest' && !guest){ toast('نام مهمان رو بنویس.', 'warn'); return; }
    const it = itemOf(d.itemId), qty = Math.max(1, +d.qty||1), paid = d.paid==='1', date = stamp(+d.date);
    db.fridge.push({id:uid(), studentId: d.who==='guest' ? null : d.who, guest, itemId:it.id, name:it.name, unit:+it.price||0, qty, date, paid, paidAt: paid ? date : null});
    save();
    const nm = guest || (byId(d.who)||{}).name;
    toast(`${fa(qty)} ${it.name} برای ${nm} ثبت شد${paid?'':' (نسیه)'}.`, paid ? 'ok' : 'warn');
    back(); refresh();
  }
};

/* ================== ACTIONS ================== */
function afterCheckToast(s){
  const r = st(s).remaining;
  if(r===0) toast(`جلسات ${s.name} تمام شد. وقت تمدیده!`, 'danger', {label:'تمدید', act:'renew', id:s.id});
  else if(r<0) toast(`${s.name} ${fa(-r)} جلسه بیشتر از دوره اومده.`, 'danger', {label:'تمدید', act:'renew', id:s.id});
  else if(r<=db.settings.warnAt) toast(`حضور ${s.name} ثبت شد. فقط ${fa(r)} جلسه مانده.`, 'warn');
  else toast(`حضور ${s.name} ثبت شد. ${fa(r)} جلسه باقی‌مانده.`, 'ok');
}
async function checkIn(id, day){
  day = day || Date.now();
  const s = byId(id), x = st(s), isToday = sameDay(day, Date.now());
  const dayTxt = isToday ? 'امروز' : jday(day);
  if(inDay(s, day)){
    if(!await ask(`لغو حضور ${dayTxt}؟`, `حضور ${s.name} برای ${dayTxt} حذف می‌شه و یک جلسه بهش برمی‌گرده.`, 'لغو حضور')) return;
    const rec = realAtt(s).filter(a=>sameDay(a.date,day)).sort((a,b)=>b.date-a.date)[0];
    s.attendance = s.attendance.filter(a=>a!==rec); save();
    toast(`حضور ${s.name} لغو شد.`, 'info'); refresh(); return;
  }
  if(x.status==='none' || x.remaining<=0){
    if(!await ask('جلسه‌ای باقی نمونده', `${s.name} ${x.status==='none'?'هنوز دوره‌ای نداره':'جلساتش تموم شده'}. حضور ثبت بشه؟ بعد از تمدید از دوره‌ی جدید کم می‌شه.`, 'ثبت حضور', false)) return;
  }
  s.attendance.push({id:uid(), date:stamp(day)}); save();
  afterCheckToast(s); refresh();
  const b = document.querySelector(`.chk[data-id="${id}"]`); if(b) b.classList.add('pop');
}

  coachPick(){ detId = null; coachSheet(); },
  coachSet(id){ db.settings.coachId = id; save(); closeSheet(); render(true); },
  coachManage(){ closeSheet(); ACT.tab('settings'); },
  coachForm(id){ detId = null; formCoach(id); showSheet(); },
  async coachDel(id){
    const c = coachOf(id), n = db.students.filter(s=>s.coachId===id).length;

  },
  itemForm(id){ detId = null; formItem(id); showSheet(); },
  async itemDel(id){
    if(db.items.length<=1){ toast('حداقل یک آیتم باید باشه.', 'warn'); return; }
    const it = itemOf(id); if(!await ask(`حذف «${it.name}»؟`, 'سوابق قبلی برداشت این آیتم باقی می‌مونه.', 'حذف')) return;

  fridgeToggle(id){ const f = db.fridge.find(x=>x.id===id); f.paid = !f.paid; f.paidAt = f.paid ? Date.now() : null; save(); refresh(); toast(f.paid ? 'حساب شد.' : 'به نسیه برگشت.', f.paid ? 'ok' : 'info'); },
  async fridgeSettle(k){

    const sum = recs.reduce((a,f)=>a+f.qty*f.unit,0), nm = isG ? k.slice(2) : (byId(k)||{}).name;
    if(!await ask('تسویه‌ی یخچال', `همه‌ی برداشت‌های ${nm}${sum?' به مبلغ '+money(sum):''} حساب‌شده ثبت بشه؟`, 'حساب کرد', false)) return;
    recs.forEach(f => { f.paid = true; f.paidAt = Date.now(); }); save(); refresh(); toast(`حساب یخچال ${nm} تسویه شد.`, 'ok');
  },
  async fridgeDel(id){ if(!await ask('حذف این برداشت؟', 'این مورد کلاً پاک می‌شه.', 'حذف')) return; db.fridge = db.fridge.filter(x=>x.id!==id); save(); refresh(); },
  async delAtt(aid){ const s = byId(detId); if(!await ask('حذف این حضور؟','یک جلسه به شاگرد برمی‌گرده.','حذف')) return; s.attendance = s.attendance.filter(a=>a.id!==aid); save(); refresh(); toast('حضور حذف شد.', 'info'); },
  async delImported(id){ const s = byId(id); if(!await ask('حذف جلسات از قبل؟','جلساتی که موقع ثبت‌نام به‌عنوان «از قبل» زده بودی حذف می‌شن.','حذف')) return; s.attendance = s.attendance.filter(a=>!a.imported); save(); refresh(); },
  async delPay(pid){ const s = byId(detId); if(!await ask('حذف این پرداخت؟','مبلغش به بدهی شاگرد اضافه می‌شه.','حذف')) return; s.payments = s.payments.filter(p=>p.id!==pid); save(); refresh(); toast('پرداخت حذف شد.', 'info'); },
  async delPkg(pid){ const s = byId(detId); if(!await ask('حذف این دوره؟','جلسات و شهریه‌ی این دوره از حساب شاگرد حذف می‌شه.','حذف')) return; s.packages = s.packages.filter(p=>p.id!==pid); save(); refresh(); toast('دوره حذف شد.', 'info'); },
  async delStudent(id){ const s = byId(id); if(!await ask(`حذف ${s.name}؟`,'همه‌ی حضورها، پرداخت‌ها و سوابق یخچالش هم پاک می‌شه.','حذف شاگرد')) return; db.students = db.students.filter(x=>x.id!==id); db.fridge = db.fridge.filter(f=>f.studentId!==id); save(); closeSheet(); refresh(); toast(`${s.name} حذف شد.`, 'info'); },
  warn(d){ db.settings.warnAt = Math.max(0, Math.min(10, db.settings.warnAt + (+d))); save(); render(false); },
  export(){ exportData(); },
  import(){ $('#importFile').value=''; $('#importFile').click(); },
  async reset(){ if(!await ask('پاک کردن همه‌ی اطلاعات؟','همه‌ی شاگردها، مربی‌ها، حضورها، پرداخت‌ها و سوابق یخچال پاک می‌شن. اگه بکاپ نداری، اول بکاپ بگیر.','پاک کردن همه')) return; db = DEF(); save(); render(true); toast('همه‌ی اطلاعات پاک شد.', 'info'); },
};

/* ================== SHEET / TOAST / DIALOG / DATE PICKER ================== */
function showSheet(){ $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); $('#sheetBody').scrollTop = 0; document.body.style.overflow='hidden'; }
function closeSheet(){ $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); detId = null; document.body.style.overflow=''; }
function back(){ if(detId && byId(detId)){ renderDetail(); $('#sheetBody').scrollTop = 0; } else closeSheet(); }

function toast(msg, type='ok', action){
  const C = {ok:'var(--gold)', warn:'var(--warn)', danger:'var(--danger)', info:'#9FB4C7'};
  const t = document.createElement('div'); t.className = 'toast'; t.style.setProperty('--c', C[type]||C.ok);
  t.innerHTML = `<span class="d"></span><span class="m">${esc(msg)}</span>${action?`<button class="btn primary" data-act="${action.act}" data-id="${action.id}">${action.label}</button>`:''}`;
  const box = $('#toasts'); box.prepend(t);
  while(box.children.length>3) box.lastChild.remove();
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 260); }, action ? 5200 : 2800);
}
function openDlg(html){ const d = $('#dlg'), c = $('#dlgCard'); c.onclick = null; c.innerHTML = html; d.classList.add('show'); return {d, c}; }
function ask(title, msg, ok='تأیید', danger=true){
  return new Promise(res => {
    const {d} = openDlg(`<h4>${esc(title)}</h4><p>${esc(msg)}</p><div class="bs"><button class="btn" id="dNo">انصراف</button><button class="btn ${danger?'danger':'primary'}" id="dOk">${esc(ok)}</button></div>`);
    const done = v => { d.classList.remove('show'); res(v); };
    $('#dOk').onclick = e => { e.stopPropagation(); done(true); };
    $('#dNo').onclick = e => { e.stopPropagation(); done(false); };
    d.onclick = e => { if(e.target===d) done(false); };
  });
}
function datePicker(ts, noFuture){
  return new Promise(res => {
    const sel = jOf(ts), tj = jOf(Date.now());
    let vy = sel.jy, vm = sel.jm;
    const {d, c} = openDlg('');
    const done = v => { d.classList.remove('show'); c.onclick = null; res(v); };
    const draw = () => {
      const len = jmLen(vy, vm), g = toG(vy, vm, 1), start = (new Date(g.gy, g.gm-1, g.gd).getDay() + 1) % 7;
      let cells = ''; for(let i=0;i<start;i++) cells += '<span></span>';
      for(let dd=1; dd<=len; dd++){
        const isSel = vy===sel.jy && vm===sel.jm && dd===sel.jd, isT = vy===tj.jy && vm===tj.jm && dd===tj.jd;
        const fri = (start + dd - 1) % 7 === 6;
        const fut = noFuture && (vy>tj.jy || (vy===tj.jy && (vm>tj.jm || (vm===tj.jm && dd>tj.jd))));
        cells += `<button class="${isSel?'on':''} ${isT?'today':''} ${fri?'fri':''}" data-d="${dd}" ${fut?'disabled':''}>${fd(dd)}</button>`;
      }
      c.innerHTML = `<div class="dp-h"><button data-nav="-1" aria-label="ماه قبل">${I.chevR}</button><b>${JM[vm-1]} ${fd(vy)}</b><button data-nav="1" aria-label="ماه بعد">${I.chevL}</button></div>
        <div class="dp-w">${['ش','ی','د','س','چ','پ','ج'].map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="dp-g">${cells}</div>
        <div class="dp-foot"><button class="btn" data-x="1">انصراف</button><button class="btn primary" data-today="1">امروز</button></div>`;
    };
    c.onclick = e => {
      const b = e.target.closest('button'); if(!b || b.disabled) return; e.stopPropagation();
      if(b.dataset.nav){ vm += +b.dataset.nav; if(vm<1){vm=12;vy--;} if(vm>12){vm=1;vy++;} draw(); }
      else if(b.dataset.d){ const t = tsOfJ(vy, vm, +b.dataset.d); done(sameDay(t, Date.now()) ? Date.now() : t); }
      else if(b.dataset.today) done(Date.now());
      else if(b.dataset.x) done(null);
    };
    d.onclick = e => { if(e.target===d) done(null); };
    draw();
  });
}

/* ================== BACKUP ================== */
async function exportData(){
  const payload = JSON.stringify({app:'LevelUp', version:2, exportedAt:Date.now(), data:db}, null, 2);
  const j = jOf(Date.now()), name = `LevelUp-backup-${j.jy}-${String(j.jm).padStart(2,'0')}-${String(j.jd).padStart(2,'0')}.json`;
  const blob = new Blob([payload], {type:'application/json'});
  const mark = () => { db.settings.lastBackup = Date.now(); save(); refresh(); toast('بکاپ آماده شد.', 'ok'); };
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'بکاپ LevelUp'}); mark(); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); mark();
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{
    const obj = JSON.parse(await f.text()); const data = obj.data || obj;
    if(!data || !Array.isArray(data.students)) throw new Error('bad');
    if(!await ask('بازگردانی بکاپ؟', `${fa(data.students.length)} شاگرد در این فایل هست. اطلاعات فعلی با این فایل جایگزین می‌شه.`, 'بازگردانی', false)) return;
    db = normalize(data); save(); render(true); toast('اطلاعات برگردونده شد.', 'ok');
  }catch(err){ toast('این فایل بکاپ LevelUp نیست یا خراب شده.', 'danger'); }
});

/* ================== ICON / BOOT ================== */
function makeIcon(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
    g.fillStyle = '#0A0A0B'; g.fillRect(0,0,180,180);
    const gr = g.createLinearGradient(30,30,150,150); gr.addColorStop(0,'#F7E3A1'); gr.addColorStop(.5,'#D4AF37'); gr.addColorStop(1,'#A67C1F');
    g.fillStyle = gr; g.font = '76px "Russo One", "Arial Black", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('LU', 90, 82);
    g.beginPath(); g.roundRect ? g.roundRect(44,130,92,10,5) : g.rect(44,130,92,10); g.fill();
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
    const f = document.createElement('link'); f.rel = 'icon'; f.href = l.href; document.head.appendChild(f);
  }catch(e){}
}
render(true);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(makeIcon);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
